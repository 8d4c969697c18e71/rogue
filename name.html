<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
  <title>Rogue</title>
  <link rel="stylesheet" href="./base.css">
</head>
<body>
  <div id="note"></div>
  <div class="sub1">
    <div class="sub2">
      <canvas id="canvas"></canvas>
    </div>
    <div class="sub3">
      <div id="log"></div>
      <div id="shop"></div>
    </div>
  </div>
  <div class="sub4">
    <div id="info"></div>
    <div id="inv"></div>
  </div>
  <div class="button" id="button">
    <button id="btn_z" class="btn">Z</button>
    <button id="btn_x" class="btn">X</button>
    <button id="btn_c" class="btn">C</button>
    <div></div>
    <div class="arrow" id="arrow">
      <button id="btn_left" class="btn btn_arrow">←</button>
      <button id="btn_up" class="btn btn_arrow">↑</button>
      <button id="btn_down" class="btn btn_arrow">↓</button>
      <button id="btn_right" class="btn btn_arrow">→</button>
      <button id="btn_upleft" class="btn btn_arrow">↖</button>
      <button id="btn_downleft" class="btn btn_arrow">↙</button>
      <button id="btn_upright" class="btn btn_arrow">↗</button>
      <button id="btn_downright" class="btn btn_arrow">↘</button>
    </div>
  </div>
  
  <script src="./src/data.js"></script>
  <script src="./src/anim.js"></script>
  <script src="./src/common.js"></script>
  <script src="./src/name.js"></script>
</body>
</html>
